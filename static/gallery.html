<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HakiStream Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --gradient-start: #818cf8;
            --gradient-end: #c084fc;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .nav-links a:hover {
            background: var(--surface);
        }
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        h1 {
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 600;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        .video-card {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: var(--primary);
        }
        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--border);
            position: relative;
        }
        .video-thumbnail::after {
            content: "▶";
            position: absolute;
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.7);
            transition: transform 0.2s;
        }
        .video-card:hover .video-thumbnail::after {
            transform: scale(1.1);
            color: white;
        }
        .video-info {
            padding: 1rem;
            flex: 1;
            display: flex;
            align-items: center;
        }
        .video-title {
            font-weight: 500;
            font-size: 1rem;
            color: var(--text-main);
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--surface);
            border-radius: 12px;
            border: 1px dashed var(--border);
            color: var(--text-muted);
        }

        /* Modal Player */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            width: 90%;
            max-width: 1000px;
            background: var(--bg-color);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .modal-header {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .close-btn:hover {
            color: white;
        }
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <header>
        <a href="/ui" class="logo">HakiStream</a>
        <div class="nav-links">
            <a href="/ui">Dashboard</a>
            <a href="/gallery" style="color: var(--primary);">Gallery</a>
        </div>
    </header>

    <main>
        <h1>Video Gallery</h1>
        <div id="gallery-grid" class="gallery-grid">
            <div class="empty-state">Loading videos...</div>
        </div>
    </main>

    <!-- Video Player Modal -->
    <div id="video-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Video Title</h3>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="player-wrapper">
                <video id="modal-video" controls></video>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        const token = localStorage.getItem('token');

        async function fetchVideos() {
            const grid = document.getElementById('gallery-grid');
            
            if (!token) {
                grid.innerHTML = `<div class="empty-state">
                    <h3>Authentication Required</h3>
                    <p style="margin-top: 1rem; margin-bottom: 1.5rem;">You need to be logged in to view the gallery.</p>
                    <a href="/ui" style="background: var(--primary); color: white; padding: 0.6rem 1.2rem; border-radius: 8px; text-decoration: none;">Go to Login</a>
                </div>`;
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/videos`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    throw new Error('Session expired. Please log in again.');
                }

                if (!response.ok) throw new Error('Failed to load videos');

                const data = await response.json();
                renderGallery(data);
            } catch (err) {
                grid.innerHTML = `<div class="empty-state" style="color: var(--danger); border-color: var(--danger);">
                    ${err.message || 'Error loading videos.'}
                </div>`;
            }
        }

        function renderGallery(videos) {
            const grid = document.getElementById('gallery-grid');
            
            if (!videos || videos.length === 0) {
                grid.innerHTML = `<div class="empty-state">
                    <h3>No videos found</h3>
                    <p style="margin-top: 1rem;">Videos uploaded to the stream will appear here.</p>
                </div>`;
                return;
            }

            grid.innerHTML = videos.map(v => {
                const name = v.name || v.title || v;
                const id = v.id || name;
                
                // Strip Unix timestamp prefix (e.g., "1781235160-") from the displayed name
                const displayName = name.replace(/^\d+-/, '');
                const safeId = id.replace(/'/g, "\\'");
                const safeName = displayName.replace(/'/g, "\\'");
                
                return `
                    <div class="video-card" onclick="openVideo('${safeId}', '${safeName}')">
                        <div class="video-thumbnail">
                            <video src="${API_BASE}/videos/${safeId}?token=${token}#t=1" preload="metadata" muted playsinline style="width: 100%; height: 100%; object-fit: cover; pointer-events: none;"></video>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${displayName}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openVideo(id, title) {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('modal-video');
            const modalTitle = document.getElementById('modal-title');

            modalTitle.textContent = title;
            video.src = `${API_BASE}/videos/${id}?token=${token}`;
            modal.classList.add('active');
            video.play().catch(e => console.log('Autoplay prevented', e));
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('modal-video');
            
            video.pause();
            video.src = "";
            modal.classList.remove('active');
        }

        // Close modal when clicking outside content
        document.getElementById('video-modal').addEventListener('click', (e) => {
            if (e.target.id === 'video-modal') {
                closeModal();
            }
        });

        // Init
        document.addEventListener('DOMContentLoaded', fetchVideos);
    </script>
</body>
</html>
