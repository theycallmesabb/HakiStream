<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HakiStream Dashboard</title>
    <!-- Modern font for premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
            --gradient-start: #818cf8;
            --gradient-end: #c084fc;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Glassmorphism Header */
        header {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            cursor: pointer;
        }
        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        button, .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }
        button:hover:not(:disabled), .btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-outline:hover {
            background-color: var(--surface);
            border-color: var(--text-muted);
            box-shadow: none;
        }
        .btn-outline.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .btn-danger {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        
        .btn-danger:hover {
            background-color: var(--danger);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        .card {
            background-color: var(--surface);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Auth Styles */
        .auth-container {
            max-width: 420px;
            margin: 4rem auto;
            position: relative;
        }
        .auth-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            z-index: -1;
            border-radius: 18px;
            opacity: 0.2;
            filter: blur(8px);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab.active {
            color: var(--text-main);
            border-bottom-color: var(--primary);
        }
        
        .tab:hover:not(.active) {
            color: var(--text-main);
        }
        /* Dashboard Styles */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }
        @media (max-width: 860px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        .upload-area {
            border: 2px dashed var(--border);
            padding: 2rem;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            background-color: rgba(15, 23, 42, 0.3);
            cursor: pointer;
            position: relative;
        }
        
        .upload-area:hover {
            border-color: var(--primary);
            background-color: rgba(99, 102, 241, 0.05);
        }
        .upload-area input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .upload-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .upload-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        /* Custom Scrollbar for video list */
        .video-list::-webkit-scrollbar { width: 6px; }
        .video-list::-webkit-scrollbar-track { background: transparent; }
        .video-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .video-list::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        .video-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 1rem 1.2rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .video-item:hover {
            border-color: var(--primary);
            transform: translateX(4px);
            background: rgba(30, 41, 59, 0.9);
        }
        .video-title-text {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .video-player-container {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .hidden {
            display: none !important;
        }

        /* Gallery Styles */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        .video-card {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: var(--primary);
        }
        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--border);
            position: relative;
        }
        .video-thumbnail::after {
            content: "▶";
            position: absolute;
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.7);
            transition: transform 0.2s;
        }
        .video-card:hover .video-thumbnail::after {
            transform: scale(1.1);
            color: white;
        }
        .video-info {
            padding: 1rem;
            flex: 1;
            display: flex;
            align-items: center;
        }
        .video-card-title {
            font-weight: 500;
            font-size: 1rem;
            color: var(--text-main);
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            background: var(--surface);
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            transform: translateY(100px) scale(0.9);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
        }
        .toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .toast-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .toast.success .toast-icon { background: var(--success); }
        .toast.error .toast-icon { background: var(--danger); }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="if(token) navigateTo('dashboard')">HakiStream</div>
        <div class="nav-links">
            <span id="user-greeting" class="hidden" style="color: var(--text-muted); font-size: 0.9rem; margin-right: 0.5rem;"></span>
            <button id="nav-dashboard" class="btn-outline hidden" onclick="navigateTo('dashboard')">Dashboard</button>
            <button id="nav-gallery" class="btn-outline hidden" onclick="navigateTo('gallery')">Gallery</button>
            <button id="nav-logout" class="btn-danger hidden" onclick="logout()">Logout</button>
        </div>
    </header>
    <main>
        <!-- Authentication Section -->
        <div id="auth-section" class="card auth-container">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">Sign In</div>
                <div class="tab" onclick="switchTab('register')">Create Account</div>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group" id="name-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username">
                </div>
                <div class="form-group" id="email-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your Email"/>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" id="auth-submit-btn" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">Sign In</button>
            </form>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden">
            <div class="dashboard-grid">
                
                <!-- Left Column (Controls & List) -->
                <div class="left-col">
                    <!-- Upload Card -->
                    <div class="card">
                        <h3 style="margin-bottom: 0.5rem;">Upload Video</h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">Max file size: 50MB</p>
                        
                        <form id="upload-form" onsubmit="handleUpload(event)">
                            <div class="upload-area" id="drop-zone">
                                <span class="upload-icon">📁</span>
                                <div class="upload-text">
                                    <strong>Click or drag video here</strong><br>
                                    <span id="file-name-display" style="color: var(--primary); margin-top: 0.5rem; display: block;"></span>
                                </div>
                                <input type="file" id="video-file" name="file" accept="video/*" required onchange="updateFileName()">
                            </div>
                            <button type="submit" style="width: 100%">Upload to Stream</button>
                        </form>
                    </div>
                    <!-- Video List Card -->
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                            <h3>Your Library</h3>
                            <button onclick="fetchVideos()" class="btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">↻ Refresh</button>
                        </div>
                        <div id="video-list" class="video-list">
                            <div class="empty-state">Loading library...</div>
                        </div>
                    </div>
                </div>
                <!-- Right Column (Player) -->
                <div class="right-col">
                    <div class="card" style="position: sticky; top: 100px;">
                        <h3 id="now-playing-title" style="margin-bottom: 1.5rem; color: var(--primary);">Select a video to play</h3>
                        <div class="video-player-container">
                            <video id="video-player" controls>
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gallery Section -->
        <div id="gallery-section" class="hidden">
            <h1 style="margin-bottom: 2rem; font-size: 2rem; font-weight: 600;">Video Gallery</h1>
            <div id="gallery-grid" class="gallery-grid">
                <div class="empty-state">Loading videos...</div>
            </div>
        </div>

    </main>
    <!-- Global Toast Notification -->
    <div id="toast" class="toast">
        <span class="toast-icon">✓</span>
        <span id="toast-msg">Message here</span>
    </div>
    <script>
        // Use relative path so it seamlessly works when served via Gin
        const API_BASE = ''; 
        let currentMode = 'login';
        let token = localStorage.getItem('token');
        let currentUsername = localStorage.getItem('username');

        // Initialize App based on Token presence
        function init() {
            if (token) {
                navigateTo('dashboard');
            } else {
                showAuth();
            }
        }

        function navigateTo(page) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('gallery-section').classList.add('hidden');

            document.getElementById('nav-dashboard').classList.remove('active');
            document.getElementById('nav-gallery').classList.remove('active');

            document.getElementById('nav-dashboard').classList.remove('hidden');
            document.getElementById('nav-gallery').classList.remove('hidden');
            document.getElementById('nav-logout').classList.remove('hidden');
            
            const greeting = document.getElementById('user-greeting');
            greeting.classList.remove('hidden');
            if(currentUsername) greeting.textContent = `Hi, ${currentUsername}`;

            // Stop playing video when navigating
            const videoPlayer = document.getElementById('video-player');
            if(videoPlayer) {
                videoPlayer.pause();
                videoPlayer.src = "";
                document.getElementById('now-playing-title').textContent = "Select a video to play";
            }

            if (page === 'dashboard') {
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('nav-dashboard').classList.add('active');
                fetchVideos();
            } else if (page === 'gallery') {
                document.getElementById('gallery-section').classList.remove('hidden');
                document.getElementById('nav-gallery').classList.add('active');
                fetchVideos();
            }
        }

        // File Input UI Update
        function updateFileName() {
            const input = document.getElementById('video-file');
            const display = document.getElementById('file-name-display');
            if (input.files.length > 0) {
                display.textContent = input.files[0].name;
            } else {
                display.textContent = '';
            }
        }
        // Toast Notification System
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-msg');
            const icon = toast.querySelector('.toast-icon');
            
            msg.textContent = message;
            toast.className = `toast show ${type}`;
            icon.textContent = type === 'success' ? '✓' : '!';
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }
        // Standardized API Caller
        async function apiCall(endpoint, options = {}) {
            const headers = { ...options.headers };
            
            if (token) {
                // If API uses Bearer token
                headers['Authorization'] = `Bearer ${token}`;
            }
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    ...options,
                    headers
                });
                
                if (response.status === 401) {
                    logout(false);
                    throw new Error('Session expired. Please login again.');
                }
                
                return response;
            } catch (err) {
                console.error('API Error:', err);
                throw err;
            }
        }
        function showAuth() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('gallery-section').classList.add('hidden');
            
            document.getElementById('nav-dashboard').classList.add('hidden');
            document.getElementById('nav-gallery').classList.add('hidden');
            document.getElementById('nav-logout').classList.add('hidden');
            document.getElementById('user-greeting').classList.add('hidden');
            
            switchTab(currentMode);
        }
        function switchTab(mode) {
            currentMode = mode;
            const tabs = document.querySelectorAll('.tab');
            tabs[0].classList.toggle('active', mode === 'login');
            tabs[1].classList.toggle('active', mode === 'register');
            document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
            
            const nameGroup = document.getElementById('name-group');
            const usernameInput = document.getElementById('username');
            if (mode === 'login') {
                nameGroup.classList.add('hidden');
                usernameInput.removeAttribute('required');
            } else {
                nameGroup.classList.remove('hidden');
                usernameInput.setAttribute('required', 'required');
            }
        }
        // Authentication logic
        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const endpoint = currentMode === 'login' ? '/login' : '/register';
            const btn = document.getElementById('auth-submit-btn');
            try {
                btn.disabled = true;
                btn.textContent = 'Please wait...';
                
                let bodyObj = {};
                if (currentMode === 'login') {
                    bodyObj = { email: email, password: password };
                } else {
                    bodyObj = { name: username, email: email, password: password };
                }

                const res = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyObj)
                });
                let data = {};
                try { data = await res.json(); } catch(e) {}
                if (res.ok) {
                    showToast(`${currentMode === 'login' ? 'Welcome back!' : 'Account created!'}`);
                    
                    if (data.token) {
                        token = data.token;
                        currentUsername = currentMode === 'login' ? email : username;
                        localStorage.setItem('token', token);
                        localStorage.setItem('username', currentUsername);
                    } else if (currentMode === 'register') {
                        // Switch to login if register API doesn't auto-login
                        switchTab('login');
                        return;
                    }
                    
                    navigateTo('dashboard');
                    document.getElementById('password').value = '';
                } else {
                    showToast(data.error || data.message || 'Authentication failed', 'error');
                }
            } catch (err) {
                showToast('Network error during authentication', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = currentMode === 'login' ? 'Sign In' : 'Create Account';
            }
        }
        async function logout(callApi = true) {
            if (callApi && token) {
                try {
                    await apiCall('/logout', { method: 'POST' });
                } catch (e) {
                    console.log('Logout API error ignored');
                }
            }
            token = null;
            currentUsername = null;
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            
            showAuth();
            showToast('Logged out successfully');
            
            // Reset player state
            const videoPlayer = document.getElementById('video-player');
            videoPlayer.pause();
            videoPlayer.src = "";
            document.getElementById('now-playing-title').textContent = "Select a video to play";
        }
        // Video Upload
        async function handleUpload(e) {
            e.preventDefault();
            const fileInput = document.getElementById('video-file');
            const file = fileInput.files[0];
            
            if (!file) {
                showToast('Please select a video file first', 'error');
                return;
            }
            const formData = new FormData();
            // Name 'file' is usually standard for gin's FormFile("file")
            formData.append('file', file);
            formData.append('video', file);
            const btn = e.target.querySelector('button[type="submit"]');
            
            try {
                showToast('Uploading your video...', 'success');
                btn.disabled = true;
                btn.textContent = 'Uploading...';
                const res = await apiCall('/uploadmov', {
                    method: 'POST',
                    body: formData // Fetch API sets boundary automatically
                });
                if (res.ok) {
                    showToast('Video uploaded and processed successfully!');
                    fileInput.value = ''; 
                    document.getElementById('file-name-display').textContent = '';
                    fetchVideos(); 
                } else {
                    let data = {};
                    try { data = await res.json(); } catch(e){}
                    showToast(data.error || 'Failed to upload video', 'error');
                }
            } catch (err) {
                showToast(err.message || 'Network error during upload', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload to Stream';
            }
        }
        // Fetch & Render Videos
        async function fetchVideos() {
            const list = document.getElementById('video-list');
            const grid = document.getElementById('gallery-grid');

            try {
                list.innerHTML = '<div class="empty-state">Loading library...</div>';
                grid.innerHTML = '<div class="empty-state">Loading videos...</div>';
                const res = await apiCall('/videos');
                
                if (res.ok) {
                    const data = await res.json();
                    renderVideos(data);
                } else {
                    list.innerHTML = '<div class="empty-state" style="color: var(--danger);">Failed to load videos</div>';
                    grid.innerHTML = '<div class="empty-state" style="color: var(--danger);">Failed to load videos</div>';
                }
            } catch (err) {
                list.innerHTML = '<div class="empty-state" style="color: var(--danger);">Network error</div>';
                grid.innerHTML = '<div class="empty-state" style="color: var(--danger);">Network error</div>';
            }
        }
        function renderVideos(responsePayload) {
            const list = document.getElementById('video-list');
            const grid = document.getElementById('gallery-grid');
            
            let videos = Array.isArray(responsePayload) 
                ? responsePayload 
                : (responsePayload.videos || responsePayload.data || responsePayload.items || []);
            
            if (videos.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size: 2rem; display: block; margin-bottom: 1rem; opacity: 0.5;">📭</span>
                        Your library is empty.<br>Upload a video to get started.
                    </div>`;
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <h3>No videos found</h3>
                        <p style="margin-top: 1rem;">Videos uploaded to the stream will appear here.</p>
                    </div>`;
                return;
            }

            // Render Dashboard List
            list.innerHTML = videos.map(v => {
                const id = v.id || v.ID || v.filename || v.name || v;
                const name = v.name || v.title || v.filename || `Video ${id}`;
                
                // Strip Unix timestamp prefix (e.g., "1781235160-") from the displayed name
                const displayName = name.replace(/^\d+-/, '');
                const safeId = id.replace(/'/g, "\\'");
                const safeName = displayName.replace(/'/g, "\\'");
                const duration = v.duration ? `<span style="font-size: 0.8rem; color: var(--text-muted);">${v.duration}</span>` : '';
                
                return `
                    <div class="video-item" onclick="playVideo('${safeId}', '${safeName}')">
                        <div class="video-title-text">
                            <span style="opacity: 0.8">▶</span> 
                            <span>${displayName}</span>
                        </div>
                        ${duration}
                    </div>
                `;
            }).join('');

            // Render Gallery Grid
            grid.innerHTML = videos.map(v => {
                const id = v.id || v.ID || v.filename || v.name || v;
                const name = v.name || v.title || v.filename || `Video ${id}`;
                
                // Strip Unix timestamp prefix (e.g., "1781235160-") from the displayed name
                const displayName = name.replace(/^\d+-/, '');
                const safeId = id.replace(/'/g, "\\'");
                const safeName = displayName.replace(/'/g, "\\'");
                
                return `
                    <div class="video-card" onclick="navigateToDashboardAndPlay('${safeId}', '${safeName}')">
                        <div class="video-thumbnail"></div>
                        <div class="video-info">
                            <div class="video-card-title">${displayName}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function navigateToDashboardAndPlay(id, name) {
            navigateTo('dashboard');
            // Give it a tiny delay to switch tabs before playing
            setTimeout(() => {
                playVideo(id, name);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 100);
        }

        // Video Player Action
        function playVideo(id, name) {
            const player = document.getElementById('video-player');
            document.getElementById('now-playing-title').textContent = `Now Playing: ${name}`;
            
            // To authenticate video stream requests, appending token as query param
            const streamUrl = `${API_BASE}/videos/${id}?token=${token}`;
            player.src = streamUrl;
            
            player.play().catch(e => {
                console.log('Autoplay might be prevented by the browser', e);
            });
        }
        // Initialize application when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
